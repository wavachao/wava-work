name: Publish stable release
on:
  push:
    branches: [main]
    paths:
      - skills/wava-work/VERSION
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate release metadata
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          version = Path('skills/wava-work/VERSION').read_text().strip()
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Expected a stable semantic version')
          data = json.loads(Path('skills.lock.json').read_text())
          if data['skills']['wava-work']['version'] != version:
              raise SystemExit('VERSION and registry version differ')
          notes = Path(f'releases/v{version}.md')
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit('Release notes are required')
          PY
      - name: Validate source and commit history
        run: |
          python3 skills/wava-work/scripts/validate_bundle.py skills/wava-work
          python3 skills/wava-work/scripts/bundle_registry.py --repo . verify
          python3 -m unittest discover -s tests -v
          python3 scripts/check_commits.py
      - name: Create annotated tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(cat skills/wava-work/VERSION)"
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            test "$(git rev-parse "${TAG}^{commit}")" = "${RELEASE_SHA}" || {
              echo "Existing release tag points to a different commit; refusing to move it."
              exit 1
            }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${TAG}" "${RELEASE_SHA}" -m "Wava Work ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          if gh release view "${TAG}" --json tagName > /dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving published content unchanged."
          else
            gh release create "${TAG}" --verify-tag --title "Wava Work ${TAG}" \
              --notes-file "releases/${TAG}.md" --latest
          fi
